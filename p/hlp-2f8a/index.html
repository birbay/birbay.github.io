<!doctype html>
<html lang="tr" data-theme="konsol">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Helpist Panel Prototipi</title>
<style>*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Helpist Panel Prototipi</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Karla:wght@400;500;600;700&family=Archivo:wght@500;600;800&family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap">

<style>
:root{
  --bg:#f7f8fa; --sf:#fff; --sf2:#fbfbfc; --sf3:#f2f4f7;
  --line:#e3e6eb; --line2:#d9dde3; --ink:#15181d; --ink2:#5d6470; --ink3:#8b93a1;
  --ac:#2f4f9e; --ac-on:#fff; --ac-soft:#eef2fb; --ac-fg:#2f4f9e;
  --ok:#1a7f4b; --ok-soft:#eef7f1; --wn:#a06a10; --wn-soft:#fdf9ed;
  --dg:#b3261e; --dg-soft:#fdeceb;
  --r:6px; --rlg:8px; --bw:1px; --sh:none; --sh2:none;
  --ft:"IBM Plex Sans"; --mo:"IBM Plex Mono"; --dp:"IBM Plex Sans";
  --dpw:600; --dptr:-0.3px; --lbtr:.6px; --lbtf:uppercase; --rowh:42px; --navr:6px; --gap:14px;
  color-scheme:light;
}
[data-theme="kokpit"]{
  --bg:#0b0d10; --sf:#0e1116; --sf2:#12151b; --sf3:#161b23;
  --line:#1c2129; --line2:#232a34; --ink:#f2f5f9; --ink2:#9aa4b2; --ink3:#5b6472;
  --ac:#ffb020; --ac-on:#0b0d10; --ac-soft:#241c0c; --ac-fg:#ffb020;
  --ok:#41d18a; --ok-soft:#0f2018; --wn:#ffb020; --wn-soft:#241c0c;
  --dg:#ff5c5c; --dg-soft:#2a1113;
  --r:0px; --rlg:0px; --bw:1px; --sh:none; --sh2:none;
  --ft:"JetBrains Mono"; --mo:"JetBrains Mono"; --dp:"Barlow Condensed";
  --dpw:600; --dptr:1.3px; --lbtr:1.1px; --rowh:40px; --navr:0px; color-scheme:dark;
}
[data-theme="editoryal"]{
  --bg:#faf7f2; --sf:#fffdf9; --sf2:#f3efe7; --sf3:#ece6da;
  --line:#e2dbcf; --line2:#c9bfae; --ink:#231f1a; --ink2:#5c554b; --ink3:#8c8377;
  --ac:#9a4b23; --ac-on:#faf7f2; --ac-soft:#f2e6dd; --ac-fg:#8a4220;
  --ok:#2e6b4a; --ok-soft:#e9f0e9; --wn:#96631f; --wn-soft:#f6eddc;
  --dg:#a33a2a; --dg-soft:#f7e6e2;
  --r:3px; --rlg:4px; --bw:1px; --sh:none; --sh2:none;
  --ft:"Karla"; --mo:"IBM Plex Mono"; --dp:"Newsreader";
  --dpw:500; --dptr:-0.5px; --lbtr:1.1px; --rowh:46px; --navr:3px; color-scheme:light;
}
[data-theme="brutalist"]{
  --bg:#fff; --sf:#fff; --sf2:#f0f0f0; --sf3:#e6e6e6;
  --line:#000; --line2:#000; --ink:#000; --ink2:#333; --ink3:#666;
  --ac:#0033ff; --ac-on:#fff; --ac-soft:#ffe600; --ac-fg:#000;
  --ok:#006644; --ok-soft:#e2f3ea; --wn:#6b5200; --wn-soft:#ffe600;
  --dg:#ff2d00; --dg-soft:#ffeeea;
  --r:0px; --rlg:0px; --bw:2px; --sh:none; --sh2:none;
  --ft:"Archivo"; --mo:"Space Mono"; --dp:"Archivo";
  --dpw:800; --dptr:-0.9px; --lbtr:.9px; --rowh:44px; --navr:0px; color-scheme:light;
}
[data-theme="yumusak"]{
  --bg:#eef0f6; --sf:#fff; --sf2:#f6f7fb; --sf3:#eef0f8;
  --line:#e8eaf2; --line2:#dfe2ee; --ink:#1a1d29; --ink2:#5d6377; --ink3:#9297a8;
  --ac:#5b6ee1; --ac-on:#fff; --ac-soft:#eef0fd; --ac-fg:#4c5fd7;
  --ok:#2f9e6e; --ok-soft:#e4f6ec; --wn:#a5711a; --wn-soft:#fff3e0;
  --dg:#d1453b; --dg-soft:#ffe3e0;
  --r:12px; --rlg:18px; --bw:1px;
  --sh:0 1px 2px rgba(26,29,41,.05); --sh2:0 1px 2px rgba(26,29,41,.05),0 8px 24px rgba(26,29,41,.07);
  --ft:"Manrope"; --mo:"IBM Plex Mono"; --dp:"Manrope";
  --dpw:800; --dptr:-0.6px; --lbtr:.5px; --rowh:46px; --navr:12px; color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--ft),system-ui,-apple-system,sans-serif;font-size:13.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
a{color:var(--ac-fg);text-decoration:none} a:hover{opacity:.8}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.num{font-family:var(--mo),ui-monospace,monospace;font-variant-numeric:tabular-nums}
.dp{font-family:var(--dp),var(--ft),sans-serif;font-weight:var(--dpw);letter-spacing:var(--dptr)}
.lb{font-size:10.5px;font-weight:600;letter-spacing:var(--lbtr);text-transform:var(--lbtf);color:var(--ink3)}
.mut{color:var(--ink2)} .fnt{color:var(--ink3)} .r{text-align:right}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.shell{display:flex;min-height:100vh}
.side{width:236px;flex-shrink:0;background:var(--sf);border-right:var(--bw) solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;
  border-bottom:var(--bw) solid var(--line);flex-shrink:0}
.mark{width:28px;height:28px;border-radius:var(--r);background:var(--ac);color:var(--ac-on);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.nav{padding:10px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1}
.navlb{padding:14px 8px 5px}
.nv{display:flex;align-items:center;gap:10px;height:36px;padding:0 9px;border-radius:var(--navr);
  cursor:pointer;color:var(--ink2);font-size:13px;font-weight:500;border:none;background:none;
  width:100%;text-align:left}
.nv:hover{background:var(--sf3)}
.nv[aria-current="page"]{background:var(--ac-soft);color:var(--ac-fg);font-weight:700}
.nv svg{flex-shrink:0}
.cnt{margin-left:auto;font-size:11px;font-weight:700;padding:1px 6px;border-radius:20px;
  background:var(--sf3);color:var(--ink2)}
.cnt.hot{background:var(--dg-soft);color:var(--dg)}
.sidefoot{border-top:var(--bw) solid var(--line);padding:11px 14px;display:flex;align-items:center;gap:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:58px;background:var(--sf);border-bottom:var(--bw) solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:20}
.wrap{padding:20px;max-width:1400px;width:100%;margin:0 auto}

.card{background:var(--sf);border:var(--bw) solid var(--line);border-radius:var(--rlg);box-shadow:var(--sh2)}
.chd{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:var(--bw) solid var(--line)}
.ct{font-weight:700;font-size:13.5px}
.cbd{padding:15px}
.btn{height:36px;padding:0 13px;border-radius:var(--r);border:var(--bw) solid var(--line2);
  background:var(--sf);font-size:12.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--sf3)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-on)}
.btn.pri:hover{opacity:.9;background:var(--ac)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.bdg{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r);
  font-size:11px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-wn{background:var(--wn-soft);color:var(--wn)}
.b-dg{background:var(--dg-soft);color:var(--dg)} .b-ac{background:var(--ac-soft);color:var(--ac-fg)}
.b-nt{background:var(--sf3);color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;
  border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--sf);
  font-size:12px;color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:500}
.chip:hover{background:var(--sf3)}
.chip[aria-pressed="true"]{background:var(--ac-soft);border-color:var(--ac);color:var(--ac-fg);font-weight:700}
.sel{height:30px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--sf);
  color:var(--ink2);font-size:12px;padding:0 6px;cursor:pointer;max-width:180px}
.vr{width:1px;height:20px;background:var(--line);margin:0 3px}
.av{width:26px;height:26px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fbar{display:flex;align-items:center;gap:7px;padding:11px 13px;
  border-bottom:var(--bw) solid var(--line);flex-wrap:wrap}
.fchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 13px}
.fchips:not(:empty){padding:10px 13px;border-bottom:var(--bw) solid var(--line);background:var(--sf2)}
.achip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 9px;
  border-radius:var(--r);background:var(--ac-soft);color:var(--ac-fg);font-size:11.5px;font-weight:600}
.achip button{border:none;background:none;cursor:pointer;color:inherit;font-size:15px;
  line-height:1;padding:0 5px;opacity:.6}
.achip button:hover{opacity:1}
.note{background:var(--wn-soft);border:var(--bw) solid var(--line);border-left:3px solid var(--wn);
  border-radius:var(--r);padding:11px 13px;font-size:12.5px;line-height:1.55}
.note.b{background:var(--ac-soft);border-left-color:var(--ac)}
.note.g{background:var(--ok-soft);border-left-color:var(--ok)}
.grid{display:grid;gap:var(--gap)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--sf);border:var(--bw) solid var(--line);border-radius:var(--rlg);
  padding:14px 15px;box-shadow:var(--sh)}
.kpiv{font-size:24px;margin:6px 0 4px}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;align-items:center;gap:10px}
.spread{margin-left:auto}
.bar{height:7px;border-radius:4px;background:var(--sf3);overflow:hidden}
.bar>div{height:7px;border-radius:4px}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:var(--lbtr);
  text-transform:var(--lbtf);color:var(--ink3);padding:9px 13px;
  border-bottom:var(--bw) solid var(--line);background:var(--sf2);white-space:nowrap}
tbody td{padding:9px 13px;height:var(--rowh);border-bottom:var(--bw) solid var(--line);
  font-size:12.5px;vertical-align:middle}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover td{background:var(--sf2)}
tbody tr.grp td{background:var(--sf2)}
tfoot td{padding:11px 13px;font-weight:700;font-size:12.5px;background:var(--sf2)}

.fg{display:flex;flex-direction:column;gap:5px}
.inp{min-height:38px;border:var(--bw) solid var(--line2);border-radius:var(--r);padding:9px 11px;
  font-size:12.5px;background:var(--sf);color:var(--ink);display:flex;align-items:center;width:100%}
input.inp,select.inp{display:block}
.inp.ph{color:var(--ink3)} .inp.hl{border-color:var(--ac);font-weight:700}
.inp.warn{border-color:var(--wn);background:var(--wn-soft)}
.fsec{padding:14px 0;border-bottom:var(--bw) solid var(--line)}
.fsec:last-child{border-bottom:none}
.cbs{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.cb{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;
  border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--sf);
  font-size:12px;cursor:pointer;user-select:none}
.cb:has(input:checked){background:var(--ac-soft);border-color:var(--ac);color:var(--ac-fg);font-weight:700}
.cb input{accent-color:var(--ac);width:14px;height:14px;cursor:pointer}

.tl{display:flex;flex-direction:column;gap:14px;position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tld{position:absolute;left:0;width:11px;height:11px;border-radius:50%;background:var(--sf);
  border:2px solid var(--line2)}

.ov{position:fixed;inset:0;background:rgba(8,10,14,.5);z-index:60;display:flex;
  align-items:flex-start;justify-content:center;padding:48px 20px;overflow-y:auto;animation:fade .16s ease}
.mdl{background:var(--sf);border:var(--bw) solid var(--line);border-radius:var(--rlg);width:100%;
  max-width:660px;box-shadow:0 20px 50px rgba(8,10,14,.28);animation:pop .2s cubic-bezier(.2,.8,.3,1)}
.mdl.drawer{max-width:520px}
.mhd{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:var(--bw) solid var(--line)}
.mbd{padding:18px;display:flex;flex-direction:column;gap:14px}
.mdl.drawer .mbd{gap:0;max-height:64vh;overflow-y:auto}
.mft{display:flex;align-items:center;gap:9px;padding:14px 18px;border-top:var(--bw) solid var(--line);
  background:var(--sf2);flex-wrap:wrap}
.x{margin-left:auto;width:30px;height:30px;border-radius:var(--r);border:none;background:none;
  cursor:pointer;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.x:hover{background:var(--sf3)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.99)}}
@keyframes up{from{transform:translateY(100%)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:var(--bg);padding:12px 17px;border-radius:var(--r);
  font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:9px;
  max-width:calc(100% - 32px);box-shadow:0 12px 30px rgba(8,10,14,.3);
  animation:pop .2s cubic-bezier(.2,.8,.3,1)}

.tsel{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px}
.tcard{border:2px solid var(--line);border-radius:var(--rlg);overflow:hidden;cursor:pointer;
  background:var(--sf);text-align:left;padding:0;display:block;width:100%}
.tcard[aria-pressed="true"]{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.tprev{height:88px;display:flex;flex-direction:column;justify-content:space-between;padding:10px}
.tbar{height:7px;border-radius:3px}
.tmeta{padding:11px 12px;border-top:var(--bw) solid var(--line)}

.mnav{display:none}
@media (max-width:900px){
  .side{display:none}
  .wrap{padding:14px;padding-bottom:86px}
  .top{padding:0 14px;height:54px}
  .fbar{padding:10px} .cbd{padding:13px} .chd{padding:12px 13px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2{grid-template-columns:1fr!important}
  .grid[style*="300px"],.grid[style*="320px"],.grid[style*="1.3fr"],.grid[style*="1.1fr"]{
    grid-template-columns:1fr!important}
  .desk{display:none!important}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--sf);
    border-top:var(--bw) solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mnv{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;
    gap:3px;padding:6px 2px;min-height:52px;border-radius:var(--navr);color:var(--ink3);
    font-size:10px;font-weight:600;cursor:pointer;position:relative}
  .mnv[aria-current="page"]{color:var(--ac-fg);background:var(--ac-soft)}
  .mnv .pip{position:absolute;top:4px;right:calc(50% - 18px);width:7px;height:7px;
    border-radius:50%;background:var(--dg)}
  .tw table,.tw thead,.tw tbody,.tw tr,.tw td,.tw tfoot{display:block;width:100%}
  .tw thead{display:none}
  .tw tbody tr{border:var(--bw) solid var(--line);border-radius:var(--r);margin-bottom:10px;
    background:var(--sf);display:grid;grid-template-columns:1fr 1fr;padding:0}
  .tw tbody td{height:auto;border:none;display:flex;flex-direction:column;align-items:flex-start;
    gap:2px;padding:8px 12px;text-align:left}
  .tw tbody td:before{content:attr(data-l);color:var(--ink3);font-size:9.5px;font-weight:700;
    letter-spacing:var(--lbtr);text-transform:var(--lbtf)}
  .tw tbody td:first-child{grid-column:1/-1;border-bottom:var(--bw) solid var(--line);
    padding-bottom:10px;font-size:14px}
  .tw tbody td.r{text-align:left}
  .tw tbody td.mhide{display:none}
  .tw tfoot td{display:flex;gap:12px}
  .tw tfoot td:before{content:attr(data-l);flex:0 0 40%;color:var(--ink3)}
  .ov{padding:0;align-items:flex-end}
  .mdl,.mdl.drawer{max-width:100%;border-radius:var(--rlg) var(--rlg) 0 0;max-height:92vh;
    display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.3,1)}
  .mbd,.mdl.drawer .mbd{overflow-y:auto;max-height:none}
  .toast{bottom:78px} .kpiv{font-size:21px}
  .grab{display:block;width:38px;height:4px;border-radius:3px;background:var(--line2);margin:9px auto 0}
}
.grab{display:none}
.stamp{position:fixed;right:14px;bottom:14px;z-index:90;display:flex;align-items:center;gap:8px;
  background:var(--ink);color:var(--bg);padding:6px 11px;border-radius:var(--r);
  font-family:var(--ft),sans-serif;font-size:10.5px;font-weight:600;
  box-shadow:0 4px 14px rgba(8,10,14,.22);opacity:.92}
.kbd{font-family:var(--mo),monospace;font-size:10px;padding:1px 5px;border-radius:3px;
  background:var(--sf3);color:var(--ink3);border:var(--bw) solid var(--line)}
.lnk{color:var(--ac-fg);cursor:pointer;border-bottom:1px dotted var(--line2)}
.lnk:hover{border-bottom-color:var(--ac)}
.qbox{display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;
  border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--sf);
  color:var(--ink3);min-width:236px;flex:0 1 300px}
.qbox input{border:none;background:none;outline:none;flex:1;min-width:0;font-size:12px;
  color:var(--ink);-webkit-appearance:none;appearance:none}
.qbox input::-webkit-search-cancel-button{display:none}
.qbox button{border:none;background:none;color:var(--ink3);cursor:pointer;font-size:16px;
  line-height:1;padding:0 2px}
.qbox:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}

.gsov{align-items:flex-start;padding-top:72px}
.gsm{max-width:640px;overflow:hidden}
.gshd{display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:var(--bw) solid var(--line);color:var(--ink3)}
.gshd input{flex:1;border:none;background:none;outline:none;font-size:15px;color:var(--ink);
  -webkit-appearance:none;appearance:none}
.gshd input::-webkit-search-cancel-button{display:none}
.gsres{max-height:min(60vh,480px);overflow-y:auto;padding:6px}
.gsg{font-size:10px;font-weight:700;letter-spacing:var(--lbtr);text-transform:var(--lbtf);
  color:var(--ink3);padding:11px 10px 5px}
.gsr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;
  background:none;padding:9px 10px;border-radius:var(--r);cursor:pointer;font-size:12.5px}
.gsr:hover{background:var(--sf3)}
.gst{display:flex;flex-direction:column;min-width:0;flex:1;gap:1px}
.gst b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gst .fnt{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsr .spread{font-weight:700;font-size:12px}
.gsempty{padding:34px 20px;text-align:center;color:var(--ink2);font-size:12.5px;line-height:1.7}

      rank: s.black ? 4 : (same ? (used.length?0:1) : (used.length?2:3))
    };
  }).sort(function(a,b){ return a.rank-b.rank || a.km-b.km || b.uses-a.uses; });

function caseByIdRaw(id){ for(var i=0;i<CASES.length;i++) if(CASES[i].id===id) return CASES[i]; return null; }

(function build(){
  var caseNo = 300, svcId = 0, payId = 0;

  for (var i=0;i<62;i++){
    var co = pick(COMPANIES);
    var pl = pick(PLACES);
    // ilk birkaç dosya bugün/dün açılsın ki "Bugün" ve "Dün" hızlı filtreleri boş kalmasın
    var ageDays = i<2 ? 0 : (i<4 ? 1 : ri(0,178));
    var openedAt = dayStart(addDays(TODAY, -ageDays));
    var span = ri(2,11);
    var closedAt = addDays(openedAt, span);
    var isClosed = closedAt < TODAY;
    var age = daysBetween(closedAt, TODAY);

    var status;
    if (!isClosed)          status = rnd()<0.35 ? 'acik' : 'devam';
    else if (age > 45)      status = 'faturalandi';
    else if (age > 8)       status = rnd()<0.75 ? 'faturalandi' : 'faturaya_hazir';
    else                    status = rnd()<0.45 ? 'faturaya_hazir' : 'hazir_degil';

    var u = pick(USERS);
    // müşterilerin bir kısmı tekrar eden müşteri olsun (müşteri kartı anlamlı olsun diye)
    var reuse = (i>8 && rnd()<0.34) ? CASES[Math.floor(rnd()*CASES.length)] : null;
    var name = reuse ? reuse.cu : (pick(FIRST)+' '+pick(LAST));
    var c = {
      id:'c'+i,
      no:'HLP-2026-000'+(++caseNo),
      ext: co.substring(0,1)+'-'+ri(80000,89999),
      co: reuse ? reuse.co : co, cu:name,
      phone: reuse ? reuse.phone : ('+90 5'+ri(30,59)+' '+ri(100,999)+' '+ri(10,99)+' '+ri(10,99)),
      plate: reuse ? reuse.plate : (ri(1,81)+pick(['ABC','KLM','DEF','XYZ','MNO','BFN','GHI','TRZ'])+ri(100,999)),
      brand: co==='FORD'?'Ford':(co==='BORUSAN'?'BMW':(co==='TOFAŞ'?'Fiat':'Renault')),
      model: pick(BRANDS[co]),
      year: ri(2019,2025),
      city: pl[0], district: pl[1],
      issue: pick(ISSUES),
      prio: rnd()<0.18 ? 'acil' : 'normal',
      status: status,
      user: u.k,
      openedAt: openedAt,
      closedAt: isClosed ? closedAt : null,
      formNeeded: co==='FORD',
      docMissing: false, formMissing: false,
      mg: null,                       // dosya bazlı marj istisnası (yönetici girer)
      addr: null,
      lat: null, lng: null,
      locSource: 'mail',              // mail | whatsapp | manual
      locUpdatedAt: null, locUpdatedBy: null
    };
    var _cc = CITY_COORD[pl[0]] || [39.0,35.0];
    // maildan gelen konum: şehir merkezine göre kabaca kaydırılmış (belirsiz)
    c.lat = r6(_cc[0] + (rnd()-0.5)*0.16);
    c.lng = r6(_cc[1] + (rnd()-0.5)*0.20);
    // dosyaların bir kısmında müşteri WhatsApp'tan kesin konum göndermiş
    if (rnd() < 0.42){
      c.locSource='whatsapp';
      c.lat = r6(_cc[0] + (rnd()-0.5)*0.05);
      c.lng = r6(_cc[1] + (rnd()-0.5)*0.06);
      c.locUpdatedAt = addDays(openedAt, 0);
      c.locUpdatedBy = u.k;
    }
    c.addr = pl[1]+' · '+pick(['D-'+ri(100,750)+' karayolu '+ri(3,90)+'. km',
      'Sanayi Sitesi '+ri(1,20)+'. blok', 'Organize Sanayi '+ri(1,9)+'. cadde',
      'Şehir merkezi, '+pick(['Cumhuriyet','Atatürk','İstiklal'])+' caddesi']);

    // --- hizmetler
    var n = ri(1,3), used={};
    for (var j=0;j<n;j++){
      var tk = pick(TKEYS); if(used[tk]) tk = pick(TKEYS); used[tk]=1;
      var T = TYPE[tk];
      var sup = pick(supsOf(T.sup));
      var st = addDays(openedAt, ri(0,1));
      var dur = tk==='ikame' ? ri(3,9) : (tk==='konaklama' ? ri(1,4) : 0);
      var base = {konaklama:[1600,3400],taksi:[280,1400],ikame:[850,1250],lastik:[1800,6200],
                  ucak:[2400,9800],otobus:[420,1300],vip:[1900,5200],diger:[600,3800]}[tk];
      var gross = tk==='ikame' ? ri(base[0],base[1])*dur
                : tk==='konaklama' ? ri(base[0],base[1])*dur
                : ri(base[0],base[1]);
      var kisi = ri(1,4);
      var det = {};
      if (tk==='konaklama') det = {kisi:kisi, oda:Math.max(1,Math.ceil(kisi/2)), gece:dur,
        gecelik:Math.round(gross/Math.max(1,dur)), kahvalti: rnd()<0.7, oda_tipi: kisi>2?'triple':'double'};
      else if (tk==='ikame') det = {gun:dur, gunluk:Math.round(gross/Math.max(1,dur)),
        arac: pick(['Fiat Egea','Renault Clio','Ford Focus','Hyundai i20','Peugeot 301']),
        plaka: ri(1,81)+pick(['AB','KL','DF','MN'])+ri(100,999), segment:pick(['B','C','C+'])};
      else if (tk==='taksi') det = {nereden: pick(['Olay yeri','Otel','Servis','Havalimanı']),
        nereye: pick(['Servis','Otel','Terminal','Ev']), km: ri(4,42)};
      else if (tk==='lastik') det = {adet: pick([1,2,4]), ebat: pick(['205/55 R16','225/45 R17','195/65 R15'])};
      else if (tk==='ucak') det = {kisi:kisi, nereden:pick(['ADB','SAW','ESB','AYT']),
        nereye:pick(['IST','ADB','ESB','ADA']), pnr:('PNR'+ri(10000,99999))};
      else if (tk==='otobus') det = {kisi:kisi, nereden:pl[0], nereye:pick(['Ankara','İzmir','İstanbul','Bursa'])};
      else if (tk==='vip') det = {kisi:kisi, nereden:pick(['Olay yeri','Havalimanı']),
        nereye:pick(['Ev','Otel','Servis']), arac:pick(['Mercedes Vito','VW Caravelle'])};
      else det = {aciklama: pick(['Çekici hizmeti','Anahtar kopyalama','Yakıt ikmali','Akü takviyesi'])};

      var s = {
        id:'s'+(++svcId), caseId:c.id, type:tk, supplier:sup.id, supplierName:sup.n,
        startAt:st, endAt:addDays(st, dur||1), gross:gross, vat:T.vat, mg:null,
        parentId:null, seq:1, det:det,
        status: isClosed ? 'tamamlandi' : (rnd()<0.4?'devam':'planlandi')
      };
      SERVICES.push(s);

      // uzatma (yalnız ikame araçta, %30 ihtimal)
      if (tk==='ikame' && rnd()<0.3){
        var ext = ri(2,4);
        SERVICES.push({ id:'s'+(++svcId), caseId:c.id, type:tk, supplier:sup.id, supplierName:sup.n,
          startAt:s.endAt, endAt:addDays(s.endAt, ext), gross: Math.round(gross/dur)*ext,
          vat:T.vat, mg:null, parentId:s.id, seq:2, status:s.status,
          det:{gun:ext, gunluk:det.gunluk, arac:det.arac, plaka:det.plaka, segment:det.segment},
          reason:'Servis parça bekliyor, teslim gecikti' });
      }

      // ödeme
      var hasDoc = rnd() < (isClosed?0.88:0.62);
      var mth = rnd()<0.52 ? 'havale' : (rnd()<0.62 ? 'kart' : 'mailorder');
      var pAt = addDays(st, ri(0,3)); pAt = new Date(pAt.getTime()+ (ri(9,18)*3600000) + ri(0,59)*60000);
      PAYMENTS.push({ id:'p'+(++payId), caseId:c.id, serviceId:s.id, svcType:tk, supplier:sup.id,
        supplierName:sup.n, iban:sup.iban, amount:gross, dir:'out',
        method:mth, card: mth==='havale'? null : {last4:String(ri(1000,9999)), bank:pick(['Garanti','İş Bankası','Yapı Kredi','Akbank'])},
        ref: (mth==='havale'?'HVL':mth==='kart'?'KRT':'MOR')+'-'+ri(100000,999999),
        paidAt:pAt, enteredBy:u.k, hasDoc:hasDoc, status:'odendi',
        warn: (mth==='havale' && rnd()<0.14) ? 'IBAN kayıtlıdan farklı — teyit edildi' : null });
      if(!hasDoc) c.docMissing = true;

      // iade (nadir)
      if (rnd()<0.06){
        PAYMENTS.push({ id:'p'+(++payId), caseId:c.id, serviceId:s.id, svcType:tk, supplier:sup.id,
          supplierName:sup.n, iban:sup.iban, amount:Math.round(gross*0.2), dir:'refund',
          method:'havale', card:null, ref:'IAD-'+ri(100000,999999),
          paidAt:addDays(st, ri(3,7)), enteredBy:u.k, hasDoc:true, status:'odendi',
          warn:'Müşteri erken çıktı — kısmi iade' });
      }
    }

    // --- Ford formu
    if (c.formNeeded){
      var fs = !isClosed ? 'olusturuldu'
             : (rnd()<0.72 ? 'imzali_geldi' : 'gonderildi');
      FORMS.push({ id:'f'+i, caseId:c.id, type: rnd()<0.5?'Otel':'Taksi', status:fs,
        sentAt: fs==='olusturuldu'? null : addDays(closedAt, -1),
        signedAt: fs==='imzali_geldi'? addDays(closedAt, 1) : null });
      if (fs!=='imzali_geldi') c.formMissing = true;
    }

    if (status==='hazir_degil' && !c.docMissing && !c.formMissing) c.docMissing = true;
    if (status==='faturaya_hazir' || status==='faturalandi'){ c.docMissing=false; c.formMissing=false; }

    CASES.push(c);
  }

  // --- belgeler: ödemelerin dekontları + Ford formları + serbest eklenenler
  var docId = 0;
  PAYMENTS.forEach(function(p){
    if(!p.hasDoc) return;
    var img = rnd()<0.62;
    var orig = img ? ri(1800000, 5400000) : ri(90000, 620000);
    DOCS.push({ id:'d'+(++docId), caseId:p.caseId, paymentId:p.id,
      name: (p.dir==='refund'?'İade dekontu':'Dekont')+' — '+p.supplierName,
      tag: p.dir==='refund'?'Dekont':'Dekont',
      kind: img?'image':'pdf',
      bytesOrig: orig,
      bytes: img ? Math.round(orig*(0.06+rnd()*0.05)) : orig,
      by: p.enteredBy, at: p.paidAt });
  });
  FORMS.filter(function(f){ return f.status==='imzali_geldi'; }).forEach(function(f){
    var orig = ri(1400000, 3800000);
    DOCS.push({ id:'d'+(++docId), caseId:f.caseId, name:'İmzalı '+f.type.toLowerCase()+' hizmet formu',
      tag:'İmzalı form', kind:'image', bytesOrig:orig, bytes:Math.round(orig*0.08),
      by: caseByIdRaw(f.caseId).user, at: f.signedAt });
  });
  CASES.forEach(function(c){
    if(rnd()<0.3){
      var o1 = ri(120000, 480000);
      DOCS.push({ id:'d'+(++docId), caseId:c.id, name:'Tedarikçi faturası — '+c.co,
        tag:'Tedarikçi faturası', kind:'pdf', bytesOrig:o1, bytes:o1,
        by: c.user, at: c.closedAt || c.openedAt });
    }
    if(rnd()<0.16){
      var o2 = ri(24000, 90000);
      DOCS.push({ id:'d'+(++docId), caseId:c.id, name:'Hasar/masraf dökümü',
        tag:'Diğer', kind:'excel', bytesOrig:o2, bytes:o2,
        by: c.user, at: c.openedAt });
    }
  });

  CASES.sort(function(a,b){ return b.openedAt - a.openedAt; });

  // --- faturalar / alacaklar (faturalanmış dosyalardan, firma+ay bazında)
  var group = {};
  CASES.filter(function(c){ return c.status==='faturalandi'; }).forEach(function(c){
    var k = c.co+'|'+ym(c.closedAt);
    (group[k] = group[k] || []).push(c);
  });
  var rno = 780;
  Object.keys(group).sort().forEach(function(k){
    var list = group[k], co = k.split('|')[0], month = k.split('|')[1];
    var tot = list.reduce(function(a,c){ return a + caseCalc(c).invoice; }, 0);
    var last = list.reduce(function(a,c){ return (!a||c.closedAt>a)?c.closedAt:a; }, null);
    var invDate = new Date(last.getFullYear(), last.getMonth()+1, 1);
    var due = addDays(invDate, CO_TERM[co]);
    var overdue = due < TODAY;
    var paid = 0, ded = 0, st;
    var roll = rnd();
    if (!overdue)          { st='acik'; }
    else if (roll<0.45)    { paid=r2(tot); st='tahsil_edildi'; }
    else if (roll<0.70)    { paid=r2(tot*0.63); st='kismi_tahsil'; }
    else if (roll<0.85)    { paid=r2(tot*0.90); ded=r2(tot-paid); st='kesintili'; }
    else                   { st='itirazli'; }
    RECEIVABLES.push({ id:'r'+(++rno), no:'FTR-2026-0'+rno, co:co, month:month,
      caseIds:list.map(function(c){return c.id;}), invDate:invDate, due:due,
      total:r2(tot), paid:paid, ded:ded, balance:r2(tot-paid-ded), status:st,
      dedReason: ded>0 ? 'Eksik evrak — '+ri(1,3)+' dosya' : null });
  });
})();

/* ---------- hesaplar ---------- */
function svcOf(caseId){ return SERVICES.filter(function(s){ return s.caseId===caseId; }); }
function payOf(caseId){ return PAYMENTS.filter(function(p){ return p.caseId===caseId; }); }
function svcCalc(s){
  var T = TYPE[s.type];
  var c = s.caseId ? caseById(s.caseId) : null;
  var pct, src;
  if (s.mg != null)               { pct = s.mg;        src = 'bu satıra özel'; }
  else if (c && c.mg != null)     { pct = c.mg;        src = 'bu dosyaya özel'; }
  else                            { pct = T.mg;        src = '%'+T.mg+' '+T.n.toLowerCase()+' kuralı'; }
  var net = r2(s.gross/(1+s.vat/100));
  return { gross:s.gross, net:net, vat:r2(s.gross-net), margin:r2(net*pct/100),
           pct:pct, src:src, min:T.mg, below: pct < T.mg };
}
function caseCalc(c){
  var g=0,n=0,v=0,mg=0;
  svcOf(c.id).forEach(function(s){ var k=svcCalc(s); g+=k.gross; n+=k.net; v+=k.vat; mg+=k.margin; });
  payOf(c.id).forEach(function(p){ if(p.dir==='refund'){ g-=p.amount; } });
  var base=r2(n+mg), vo=r2(base*OUT_VAT/100);
  return { gross:r2(g), net:r2(n), vatIn:r2(v), margin:r2(mg), base:base, vatOut:vo,
           invoice:r2(base+vo), eff: n? r2(mg/n*100):0 };
}

var ST_LABEL = {acik:'Açık', devam:'Devam ediyor', hazir_degil:'Hazır değil',
  faturaya_hazir:'Faturaya hazır', faturalandi:'Faturalandı', iptal:'İptal'};
var ST_CLS = {acik:'b-nt', devam:'b-ac', hazir_degil:'b-wn',
  faturaya_hazir:'b-ok', faturalandi:'b-nt', iptal:'b-nt'};
var RST_LABEL = {acik:'Açık', kismi_tahsil:'Kısmi tahsil', tahsil_edildi:'Tahsil edildi',
  kesintili:'Kesintili kapandı', itirazli:'İtirazlı'};
var RST_CLS = {acik:'b-nt', kismi_tahsil:'b-wn', tahsil_edildi:'b-ok',
  kesintili:'b-nt', itirazli:'b-dg'};
var FST_LABEL = {olusturuldu:'Oluşturuldu', gonderildi:'İmza bekliyor', imzali_geldi:'İmzalı geldi'};
var FST_CLS = {olusturuldu:'b-nt', gonderildi:'b-wn', imzali_geldi:'b-ok'};

/* ===================================================================
   FİLTRE MOTORU
   =================================================================== */
var PRESETS = [
  {k:'gun',      n:'Bugün'},
  {k:'dun',      n:'Dün'},
  {k:'hafta',    n:'Bu hafta'},
  {k:'ay',       n:'Bu ay'},
  {k:'gecenay',  n:'Geçen ay'},
  {k:'son30',    n:'Son 1 ay'},
  {k:'son90',    n:'Son 3 ay'},
  {k:'yil',      n:'Bu yıl'},
  {k:'tum',      n:'Tümü'},
  {k:'ozel',     n:'Özel aralık'}
];
function presetRange(k, from, to){
  var t=TODAY, y=t.getFullYear(), mo=t.getMonth();
  switch(k){
    case 'gun':     return [dayStart(t), dayEnd(t)];
    case 'dun':     return [dayStart(addDays(t,-1)), dayEnd(addDays(t,-1))];
    case 'hafta':   var dw=(t.getDay()+6)%7; return [dayStart(addDays(t,-dw)), dayEnd(t)];
    case 'ay':      return [new Date(y,mo,1), dayEnd(t)];
    case 'gecenay': return [new Date(y,mo-1,1), new Date(y,mo,0,23,59,59)];
    case 'son30':   return [dayStart(addDays(t,-29)), dayEnd(t)];
    case 'son90':   return [dayStart(addDays(t,-89)), dayEnd(t)];
    case 'yil':     return [new Date(y,0,1), dayEnd(t)];
    case 'ozel':    return [from?new Date(from+'T00:00:00'):new Date(2000,0,1),
                            to?new Date(to+'T23:59:59'):dayEnd(t)];
    default:        return [new Date(2000,0,1), new Date(2100,0,1)];
  }
}
function presetName(k){ for(var i=0;i<PRESETS.length;i++) if(PRESETS[i].k===k) return PRESETS[i].n; return 'Tümü'; }

/* Türkçe duyarsız normalize — "34 ABC 123" ile "34abc123" eşleşsin */
function norm(x){
  return String(x==null?'':x).toLocaleLowerCase('tr-TR')
    .replace(/[ıİ]/g,'i').replace(/[şŞ]/g,'s').replace(/[ğĞ]/g,'g')
    .replace(/[üÜ]/g,'u').replace(/[öÖ]/g,'o').replace(/[çÇ]/g,'c')
    .replace(/[^a-z0-9]/g,'');
}
function hay(scope,row){
  var c = (scope==='cases') ? row
        : (row && row.caseId) ? caseById(row.caseId) : null;
  var parts=[];
  if(c) parts.push(c.no,c.ext,c.cu,c.plate,c.phone,c.city,c.district,c.issue,c.co,c.brand,c.model);
  if(scope==='services')    parts.push(TYPE[row.type].n, row.supplierName);
  if(scope==='payments')    parts.push(row.supplierName, row.ref, PAY_METHOD[row.method]?PAY_METHOD[row.method].n:'');
  if(scope==='forms')       parts.push(row.type, FST_LABEL[row.status]);
  if(scope==='suppliers')   parts.push(row.n,row.ph,row.c,row.d,row.iban);
  if(scope==='receivables') parts.push(row.no,row.co,row.month,row.dedReason);
  return norm(parts.join(' '));
}

/* her ekranın kendi filtre durumu */
function newFilter(dateField){
  return { q:'', preset:'son90', from:'', to:'', dateField:dateField,
           co:[], status:[], type:[], user:[], pmethod:[], city:'', supplier:'',
           min:'', max:'', mgMin:'', mgMax:'',
           flags:{acil:0, docMissing:0, formMissing:0, notReady:0, hasExt:0, overdue:0},
           group:'yok', sort:'date_desc' };
}
var F = {
  cases:       newFilter('opened'),
  services:    newFilter('svcStart'),
  payments:    newFilter('paid'),
  forms:       newFilter('sent'),
  receivables: newFilter('due'),
  suppliers:   newFilter('lastUsed')
};
F.suppliers.preset='tum';
F.receivables.preset='tum';

var DATE_FIELDS = {
  cases:       [['opened','Dosya açılışı'],['closed','Dosya kapanışı'],['svcStart','Hizmet başlangıcı']],
  services:    [['svcStart','Hizmet başlangıcı'],['svcEnd','Hizmet bitişi'],['opened','Dosya açılışı']],
  payments:    [['paid','Ödeme tarihi'],['opened','Dosya açılışı']],
  forms:       [['sent','Gönderim tarihi'],['closed','Dosya kapanışı']],
  receivables: [['due','Vade tarihi'],['inv','Fatura tarihi']],
  suppliers:   [['lastUsed','Son kullanım']]
};

function dateOf(scope, row, field){
  if (scope==='cases'){
    if (field==='opened') return row.openedAt;
    if (field==='closed') return row.closedAt;
    if (field==='svcStart'){ var s=svcOf(row.id); return s.length? s[0].startAt : row.openedAt; }
  }
  if (scope==='services'){
    if (field==='svcStart') return row.startAt;
    if (field==='svcEnd')   return row.endAt;
    if (field==='opened')   return caseById(row.caseId).openedAt;
  }
  if (scope==='payments'){
    if (field==='paid')   return row.paidAt;
    if (field==='opened') return caseById(row.caseId).openedAt;
  }
  if (scope==='forms'){
    if (field==='sent')   return row.sentAt;
    if (field==='closed') return caseById(row.caseId).closedAt;
  }
  if (scope==='receivables'){
    if (field==='due') return row.due;
    if (field==='inv') return row.invDate;
  }
  if (scope==='suppliers') return row.lastUsed;
  return null;
}
function caseById(id){ if(!_byId[id]) _byId[id]=CASES.filter(function(c){return c.id===id;})[0]; return _byId[id]; }

function hasExt(caseId){ return SERVICES.some(function(s){ return s.caseId===caseId && s.parentId; }); }

function filterRows(scope){
  var f = F[scope];
  var rg = presetRange(f.preset, f.from, f.to);
  var rows;

  if (scope==='cases')            rows = CASES.slice();
  else if (scope==='services')    rows = SERVICES.slice();
  else if (scope==='payments')    rows = PAYMENTS.slice();
  else if (scope==='forms')       rows = FORMS.slice();
  else if (scope==='receivables') rows = RECEIVABLES.slice();
  else if (scope==='suppliers'){
    rows = SUPPLIERS.map(function(s){
      var used = SERVICES.filter(function(x){ return x.supplier===s.id; });
      var last = used.reduce(function(a,x){ return (!a||x.startAt>a)?x.startAt:a; }, null);
      var avg = used.length ? used.reduce(function(a,x){return a+x.gross;},0)/used.length : 0;
      return Object.assign({}, s, {uses:used.length, lastUsed:last, avg:r2(avg)});
    });
  }

  var q = norm(f.q);
  return rows.filter(function(row){
    // serbest metin araması
    if(q && hay(scope,row).indexOf(q)<0) return false;
    // tarih
    if (f.preset!=='tum'){
      var d = dateOf(scope, row, f.dateField);
      if (!d || d < rg[0] || d > rg[1]) return false;
    }
    var c = (scope==='cases') ? row
          : (scope==='receivables' || scope==='suppliers') ? null
          : caseById(row.caseId);

    // firma
    if (f.co.length){
      var co = c ? c.co : (scope==='receivables' ? row.co : null);
      if (co && f.co.indexOf(co)<0) return false;
      if (!co && scope==='suppliers') return false;
    }
    // durum
    if (f.status.length){
      var st = (scope==='cases') ? row.status
             : (scope==='receivables') ? row.status
             : (scope==='forms') ? row.status
             : (c ? c.status : null);
      if (!st || f.status.indexOf(st)<0) return false;
    }
    // hizmet tipi
    if (f.type.length){
      if (scope==='services'){ if (f.type.indexOf(row.type)<0) return false; }
      else if (scope==='cases'){
        var ts = svcOf(row.id).map(function(s){return s.type;});
        if (!f.type.some(function(t){ return ts.indexOf(t)>=0; })) return false;
      } else if (scope==='payments'){
        var sv = SERVICES.filter(function(s){return s.id===row.serviceId;})[0];
        if (!sv || f.type.indexOf(sv.type)<0) return false;
      } else if (scope==='suppliers'){
        var map={otel:'konaklama',taksi:'taksi',kiralama:'ikame',lastik:'lastik',
                 bilet:'ucak',transfer:'vip',diger:'diger'};
        if (f.type.indexOf(map[row.t])<0) return false;
      }
    }
    // sorumlu
    if (f.user.length){ if (!c || f.user.indexOf(c.user)<0) return false; }
    // ödeme yöntemi
    if (f.pmethod.length){
      if (scope!=='payments') return false;
      if (f.pmethod.indexOf(row.method)<0) return false;
    }
    // il
    if (f.city){
      var ci = c ? c.city : (scope==='suppliers' ? row.c : null);
      if (ci !== f.city) return false;
    }
    // tedarikçi
    if (f.supplier){
      var sid = (scope==='services'||scope==='payments') ? row.supplier
              : (scope==='suppliers') ? row.id
              : (scope==='cases' ? (svcOf(row.id).some(function(s){return s.supplier===f.supplier;})?f.supplier:null) : null);
      if (sid !== f.supplier) return false;
    }
    // tutar
    var amt = (scope==='cases') ? caseCalc(row).gross
            : (scope==='services') ? row.gross
            : (scope==='payments') ? row.amount
            : (scope==='receivables') ? row.total
            : (scope==='suppliers') ? row.avg : null;
    if (amt!=null){
      if (f.min!=='' && amt < +f.min) return false;
      if (f.max!=='' && amt > +f.max) return false;
    }
    // marj oranı (yalnız yönetici)
    if ((f.mgMin!=='' || f.mgMax!=='')){
      var pct = (scope==='services') ? svcCalc(row).pct
              : (scope==='cases') ? caseCalc(row).eff : null;
      if (pct==null) return false;
      if (f.mgMin!=='' && pct < +f.mgMin) return false;
      if (f.mgMax!=='' && pct > +f.mgMax) return false;
    }
    // bayraklar
    var fl = f.flags;
    if (fl.acil       && !(c && c.prio==='acil')) return false;
    if (fl.docMissing){
      if (scope==='payments'){ if (row.hasDoc) return false; }
      else if (!(c && c.docMissing)) return false;
    }
    if (fl.formMissing){
      if (scope==='forms'){ if (row.status==='imzali_geldi') return false; }
      else if (!(c && c.formMissing)) return false;
    }
    if (fl.notReady   && !(c && (c.status==='hazir_degil'||c.status==='devam'||c.status==='acik'))) return false;
    if (fl.hasExt     && !(c && hasExt(c.id))) return false;
    if (fl.overdue){
      if (scope==='receivables'){ if (!(row.due < TODAY && row.balance>0)) return false; }
      else return false;
    }
    return true;
  });
}

function activeChips(scope){
  var f=F[scope], out=[];
  if(f.q) out.push(['q','"'+f.q+'"']);
  if (f.preset!=='tum'){
    var lbl = f.preset==='ozel'
      ? (f.from||'…')+' → '+(f.to||'…')
      : presetName(f.preset);
    var df = (DATE_FIELDS[scope].filter(function(x){return x[0]===f.dateField;})[0]||['',''])[1];
    out.push(['preset', lbl+' · '+df.toLowerCase()]);
  }
  f.co.forEach(function(x){ out.push(['co:'+x, x]); });
  f.status.forEach(function(x){ out.push(['status:'+x, ST_LABEL[x]||RST_LABEL[x]||FST_LABEL[x]||x]); });
  f.type.forEach(function(x){ out.push(['type:'+x, TYPE[x].n]); });
  f.user.forEach(function(x){ var u=USERS.filter(function(z){return z.k===x;})[0];
    out.push(['user:'+x, u?u.n:x]); });
  f.pmethod.forEach(function(x){ out.push(['pmethod:'+x, PAY_METHOD[x].n]); });
  if (f.city)     out.push(['city', f.city]);
  if (f.supplier){ var s=SUPPLIERS.filter(function(z){return z.id===f.supplier;})[0];
    out.push(['supplier', s?s.n:'']); }
  if (f.min!=='') out.push(['min','≥ ₺'+(+f.min).toLocaleString('tr-TR')]);
  if (f.max!=='') out.push(['max','≤ ₺'+(+f.max).toLocaleString('tr-TR')]);
  if (f.mgMin!=='') out.push(['mgMin','marj ≥ %'+f.mgMin]);
  if (f.mgMax!=='') out.push(['mgMax','marj ≤ %'+f.mgMax]);
  var FL={acil:'Acil', docMissing:'Dekont eksik', formMissing:'Form eksik',
          notReady:'Faturaya hazır değil', hasExt:'Uzatma var', overdue:'Vadesi geçen'};
  Object.keys(f.flags).forEach(function(k){ if(f.flags[k]) out.push(['flag:'+k, FL[k]]); });
  if (f.group!=='yok') out.push(['group','Grupla: '+GROUPS[f.group]]);
  return out;
}
function clearChip(scope, key){
  var f=F[scope], p=key.split(':');
  if (key==='preset'){ f.preset='tum'; return; }
  if (p[0]==='co')     { f.co = f.co.filter(function(x){return x!==p[1];}); return; }
  if (p[0]==='status') { f.status = f.status.filter(function(x){return x!==p[1];}); return; }
  if (p[0]==='type')   { f.type = f.type.filter(function(x){return x!==p[1];}); return; }
  if (p[0]==='user')   { f.user = f.user.filter(function(x){return x!==p[1];}); return; }
  if (p[0]==='pmethod'){ f.pmethod = f.pmethod.filter(function(x){return x!==p[1];}); return; }
  if (p[0]==='flag')   { f.flags[p[1]]=0; return; }
  if (key==='group')   { f.group='yok'; return; }
  f[key]='';
}

function customers(){
  if(window.__cust) return window.__cust;
  var map={};
  CASES.forEach(function(c){
    var k=c.cu;
    if(!map[k]) map[k]={name:k, phone:c.phone, plates:[], cases:[], co:{}};
    if(map[k].plates.indexOf(c.plate)<0) map[k].plates.push(c.plate);
    map[k].cases.push(c); map[k].co[c.co]=1;
  });
  window.__cust = Object.keys(map).map(function(k){ return map[k]; });
  return window.__cust;
}
function custByName(n){ return customers().filter(function(x){return x.name===n;})[0]; }
function custStats(cu){
  var g=0,mg=0,sv=[];
  cu.cases.forEach(function(c){ var k=caseCalc(c); g+=k.gross; mg+=k.margin;
    sv=sv.concat(svcOf(c.id)); });
  return {gross:r2(g), margin:r2(mg), services:sv, cases:cu.cases.length};
}
function searchAll(qs){
  var q=norm(qs);
  if(q.length<2) return null;
  var res={cases:[],customers:[],suppliers:[],services:[]};
  CASES.forEach(function(c){
    if(norm([c.no,c.ext,c.cu,c.plate,c.phone,c.city,c.issue].join(' ')).indexOf(q)>=0)
      res.cases.push(c); });
  customers().forEach(function(x){
    if(norm(x.name+' '+x.phone+' '+x.plates.join(' ')).indexOf(q)>=0) res.customers.push(x); });
  SUPPLIERS.forEach(function(s){
    if(norm([s.n,s.ph,s.c,s.d].join(' ')).indexOf(q)>=0) res.suppliers.push(s); });
  SERVICES.forEach(function(s){
    var c=caseById(s.caseId);
    if(norm(TYPE[s.type].n+' '+s.supplierName+' '+c.cu).indexOf(q)>=0) res.services.push(s); });
  res.cases=res.cases.slice(0,8); res.customers=res.customers.slice(0,6);
  res.suppliers=res.suppliers.slice(0,5); res.services=res.services.slice(0,6);
  res.total=res.cases.length+res.customers.length+res.suppliers.length+res.services.length;
  return res;
}

function kb(n){
  if(n==null) return '—';
  if(n>=1048576) return (n/1048576).toFixed(1).replace('.',',')+' MB';
  if(n>=1024) return Math.round(n/1024)+' KB';
  return n+' B';
}
/** WhatsApp / harita linkinden koordinat çıkarır (Google · Apple · Yandex · çıplak) */
function parseLoc(txt){
  if(!txt) return null;
  var t=String(txt).trim();
  var m;
  // yandex: ?ll=lng,lat  |  ?pt=lng,lat
  m = t.match(/[?&](?:ll|pt|sll|q)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/i);
  if(m && /yandex/i.test(t)) return {lat:+m[2], lng:+m[1], src:'Yandex'};
  // apple: ?ll=lat,lng  |  ?q=lat,lng
  if(m && /apple/i.test(t)) return {lat:+m[1], lng:+m[2], src:'Apple Haritalar'};
  // google: ?q=lat,lng | /@lat,lng | !3dlat!4dlng
  m = t.match(/[?&]q=(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
  if(m) return {lat:+m[1], lng:+m[2], src:/google/i.test(t)?'Google Haritalar':'Bağlantı'};
  m = t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return {lat:+m[1], lng:+m[2], src:'Google Haritalar'};
  m = t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if(m) return {lat:+m[1], lng:+m[2], src:'Google Haritalar'};
  // çıplak koordinat
  m = t.match(/^\s*(-?\d+\.\d+)\s*[,;]\s*(-?\d+\.\d+)\s*$/);
  if(m) return {lat:+m[1], lng:+m[2], src:'Koordinat'};
  return null;
}

  var txt=el.getAttribute('data-tip'); if(!txt) return;
  hideTip();
  _tip=document.createElement('div'); _tip.className='tip'; _tip.textContent=txt;
  document.body.appendChild(_tip);
  var r=el.getBoundingClientRect(), t=_tip.getBoundingClientRect();
  var left=Math.min(Math.max(8, r.left+r.width/2-t.width/2), innerWidth-t.width-8);
  var top=r.top-t.height-9;
  if(top<8){ top=r.bottom+9; _tip.classList.add('below'); }
  _tip.style.left=left+'px'; _tip.style.top=top+'px'; _tip.classList.add('on');
}

function mapQuery(c){

}

/** Google embed yüklenemezse (CSP/çevrimdışı) altta kalan çizilmiş mini harita.
 *  Dosyanın konumunu merkeze alır, yakındaki tedarikçileri mesafeye göre yerleştirir. */
function miniMap(c, typeKey){
  var W=640, Hh=190, cx=W/2, cy=Hh/2;
  var sups = typeKey ? suppliersFor(typeKey, c.city).filter(function(x){return x.same;}).slice(0,6) : [];
  var maxKm = Math.max(6, sups.reduce(function(a,x){ return Math.max(a,x.km); },0)*1.25);
  function hash(str){ var h=0; for(var i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))&0xffff; return h; }
  var grid='';
  for(var x=0;x<=W;x+=44) grid+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+Hh+'"/>';
  for(var y=0;y<=Hh;y+=44) grid+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'"/>';
  var rings=[0.4,0.7,1].map(function(f){
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(f*70)+'" fill="none" stroke="currentColor" '+
      'stroke-opacity=".22" stroke-dasharray="3 4"/>'; }).join('');
  var pins=sups.map(function(sp){
    var a=(hash(sp.s.id)%360)*Math.PI/180;
    var r=18+Math.min(1,sp.km/maxKm)*62;
    var px=cx+Math.cos(a)*r*1.9, py=cy+Math.sin(a)*r;
    return '<g><circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="5" fill="currentColor" '+
      'fill-opacity=".85"/><text x="'+(px+9).toFixed(1)+'" y="'+(py+4).toFixed(1)+'" '+
      'font-size="10" fill="currentColor" fill-opacity=".7">'+esc(sp.s.n)+'</text></g>'; }).join('');
  return '<svg class="minimap" viewBox="0 0 '+W+' '+Hh+'" preserveAspectRatio="xMidYMid slice" '+
    'aria-hidden="true"><g stroke="currentColor" stroke-opacity=".12" stroke-width="1">'+grid+'</g>'+
    '<path d="M0 128 L200 96 L380 118 L640 84" stroke="currentColor" stroke-opacity=".25" '+
    'stroke-width="7" fill="none" stroke-linecap="round"/>'+
    '<path d="M96 0 L150 190" stroke="currentColor" stroke-opacity=".18" stroke-width="5" fill="none"/>'+
    rings+pins+
    '<g transform="translate('+cx+','+cy+')">'+
    '<circle r="13" fill="currentColor" fill-opacity=".14"/>'+
    '<path d="M0 -13c-4.5 0-8 3.6-8 8 0 6 8 13 8 13s8-7 8-13c0-4.4-3.5-8-8-8z" fill="currentColor"/>'+
    '<circle cy="-5" r="2.8" fill="var(--sf)"/></g></svg>';
}
function mapBox(c, typeKey, h){
  var q=encodeURIComponent(mapQuery(c));
  var src = (c.lat!=null)
    ? 'https://www.google.com/maps?q='+q+'&z=14&hl=tr&output=embed'
    : 'https://www.google.com/maps?q='+q+'&z=12&hl=tr&output=embed';
  return '<div class="mapbox"'+(h?' style="height:'+h+'px"':'')+'>'+
    miniMap(c, typeKey)+
    '<div class="mapnote">Şematik görünüm · canlı <b>Google Haritalar</b> bu önizlemede '+
    'engelleniyor, kendi alan adınızda açılır</div>'+
    '<iframe class="gmap" loading="lazy" title="Konum haritası" referrerpolicy="no-referrer" '+
    'src="'+src+'"></iframe>'+
    '<a class="mapopen" href="'+gmapsUrl(c)+'" target="_blank" rel="noopener"'+
    tip('Konumu Google Haritalar\'da yeni sekmede açar — yol tarifi ve çevredeki işletmeler için.')+
    '>Haritalarda aç</a></div>';
}

/** Pin sürüklenebilir konum seçici. Kutu ±0,05° bir alanı temsil eder. */
var LOC_SPAN = 0.05;
function locPicker(c, d){
  var base = {lat:c.lat, lng:c.lng};
  var dx = (d.lng - base.lng)/LOC_SPAN, dy = (base.lat - d.lat)/LOC_SPAN;
  var left = Math.max(0, Math.min(1, 0.5 + dx/2))*100;
  var top  = Math.max(0, Math.min(1, 0.5 + dy/2))*100;
  return '<div class="locmap" id="locmap" data-lat="'+base.lat+'" data-lng="'+base.lng+'">'+
    miniMap(c, null)+
    '<div class="locpin" id="locpin" style="left:'+left.toFixed(2)+'%;top:'+top.toFixed(2)+'%">'+
    '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z" fill="currentColor" '+
    'fill-opacity=".18"/><circle cx="12" cy="10" r="3" fill="currentColor"/></svg></div>'+
    '<div class="lochint">Tıkla veya sürükle</div></div>';
}
function locFromPoint(el, cx, cy){
  var r=el.getBoundingClientRect();
  var fx=Math.max(0,Math.min(1,(cx-r.left)/r.width));
  var fy=Math.max(0,Math.min(1,(cy-r.top)/r.height));
  var bLat=+el.getAttribute('data-lat'), bLng=+el.getAttribute('data-lng');
  return { lat: r6(bLat - (fy-0.5)*2*LOC_SPAN), lng: r6(bLng + (fx-0.5)*2*LOC_SPAN),
           fx:fx*100, fy:fy*100 };
}

/** Hizmet türüne göre detay satırı: "2 kişi · 1 oda · 3 gece" gibi */
function svcDetLine(s){
  var d=s.det||{}, o=[];
  switch(s.type){
    case 'konaklama':
      if(d.kisi) o.push(d.kisi+' kişi'); if(d.oda) o.push(d.oda+' oda');
      if(d.gece) o.push(d.gece+' gece'); if(d.kahvalti) o.push('kahvaltı dâhil'); break;
    case 'ikame':
      if(d.arac) o.push(d.arac); if(d.plaka) o.push(d.plaka);
      if(d.gun) o.push(d.gun+' gün'); break;
    case 'taksi':
      if(d.nereden) o.push(d.nereden+' → '+d.nereye); if(d.km) o.push(d.km+' km'); break;
    case 'lastik':
      if(d.adet) o.push(d.adet+' adet'); if(d.ebat) o.push(d.ebat); break;
    case 'ucak':
      if(d.kisi) o.push(d.kisi+' kişi'); if(d.nereden) o.push(d.nereden+' → '+d.nereye);
      if(d.pnr) o.push(d.pnr); break;
    case 'otobus': case 'vip':
      if(d.kisi) o.push(d.kisi+' kişi'); if(d.nereden) o.push(d.nereden+' → '+d.nereye);
      if(d.arac) o.push(d.arac); break;
    default: if(d.aciklama) o.push(d.aciklama);
  }
  return esc(o.join(' · '));
}
/** Birim ücret: gecelik / günlük / kişi başı — yoksa tire */
function svcUnit(s){
  var d=s.det||{};
  if(s.type==='konaklama' && d.gece) return m0(s.gross/d.gece)+' /gece';
  if(s.type==='ikame' && d.gun)      return m0(s.gross/d.gun)+' /gün';
  if(d.kisi && d.kisi>1)             return m0(s.gross/d.kisi)+' /kişi';
  return '—';
}

function tPayments(rows){

  order.sort(function(a,b){
    var la=g[a].reduce(function(x,p){return Math.max(x,p.paidAt);},0);
    var lb=g[b].reduce(function(x,p){return Math.max(x,p.paidAt);},0);
    return lb-la; });
  var total=0;
  var body=order.slice(0,40).map(function(cid){
    var list=g[cid].slice().sort(function(a,b){ return a.paidAt-b.paidAt; });
    var c=caseById(cid);
    var net=list.reduce(function(a,p){ return a + (p.dir==='refund'?-p.amount:p.amount); },0);
    total+=net;
    var open = !!S.openPay[cid];
    var miss = list.filter(function(p){ return !p.hasDoc; }).length;
    var mset = {}; list.forEach(function(p){ mset[p.method]=1; });

        '<b class="num" style="color:var(--ac-fg)">'+c.no+'</b>'+
        '<div class="fnt" style="font-size:11px">'+esc(c.cu)+' · '+c.co+'</div></td>'+
      '<td data-l="Ödeme" class="mut">'+list.length+' hareket'+
        (miss?' · <span style="color:var(--wn)">'+miss+' dekontsuz</span>':'')+'</td>'+
      '<td data-l="Yöntem">'+mchips+'</td>'+
      '<td data-l="Son işlem" class="num mut">'+fmtD(list[list.length-1].paidAt)+'</td>'+
      '<td data-l="Toplam" class="r num"><b>'+m(net)+'</b></td></tr>';
    if(!open) return head;
    var kids = list.map(function(p){
      var PM=PAY_METHOD[p.method];
      return '<tr class="paykid" data-pay="'+p.id+'">'+
        '<td data-l="Hizmet"><span class="tw-branch">└</span>'+
          '<b>'+(p.svcType?TYPE[p.svcType].n:'Hizmet')+'</b>'+
          '<div class="fnt" style="font-size:11px">'+esc(p.supplierName)+' · '+p.ref+'</div></td>'+
        '<td data-l="Yön"><span class="bdg '+(p.dir==='refund'?'b-ok':'b-nt')+'">'+

          (p.card?'<div class="fnt num" style="font-size:10.5px">'+p.card.bank+' ····'+p.card.last4+'</div>':'')+'</td>'+
        '<td data-l="Tarih" class="num mut">'+fmtD(p.paidAt)+
          '<div class="fnt num" style="font-size:10.5px">'+p2(p.paidAt.getHours())+':'+p2(p.paidAt.getMinutes())+'</div></td>'+
        '<td data-l="Tutar" class="r num"><b'+(p.dir==='refund'?' style="color:var(--ok)"':'')+'>'+

function vReports(){
  var months=[];
  for(var i=5;i>=0;i--){ var d=new Date(TODAY.getFullYear(), TODAY.getMonth()-i, 1); months.push(ym(d)); }
  var byMonth={}; months.forEach(function(k){ byMonth[k]={mg:0,gross:0}; });
  CASES.forEach(function(c){ var k=ym(c.closedAt); if(byMonth[k]){
    var v=caseCalc(c); byMonth[k].mg+=v.margin; byMonth[k].gross+=v.gross; } });
  var A=H();
  var mVal=function(k){ return A? byMonth[k].mg : byMonth[k].gross; };
  var mxM=Math.max.apply(null, months.map(mVal).concat([1]));

  var byType={}; TKEYS.forEach(function(t){ byType[t]=0; });
  SERVICES.forEach(function(s){ byType[s.type]+=svcCalc(s).gross; });
  var tOrder=TKEYS.slice().sort(function(a,b){ return byType[b]-byType[a]; });
  var mxT=Math.max.apply(null, tOrder.map(function(t){return byType[t];}).concat([1]));

  var vatIn=0, vatOut=0;
  CASES.filter(function(c){return c.status==='faturalandi'||c.status==='faturaya_hazir';})
    .forEach(function(c){ var k=caseCalc(c); vatIn+=k.vatIn; vatOut+=k.vatOut; });

  var hotels=supsOf('otel').map(function(s){
    var used=SERVICES.filter(function(x){return x.supplier===s.id;});
    var mg=used.reduce(function(a,x){return a+svcCalc(x).margin;},0);
    var avg=used.length? used.reduce(function(a,x){return a+x.gross;},0)/used.length : 0;
    return {n:s.n,c:s.c,k:used.length,avg:avg,mg:mg}; })
    .filter(function(x){return x.k>0;})
    .sort(function(a,b){return H()? b.mg-a.mg : b.k-a.k;});

  var staff=USERS.map(function(u){
    var cs=CASES.filter(function(c){return c.user===u.k;});
    var sv=SERVICES.filter(function(s){ return caseById(s.caseId).user===u.k; });
    var closed=cs.filter(function(c){return c.closedAt;});
    var med=closed.length? Math.round(closed.reduce(function(a,c){
      return a+daysBetween(c.openedAt,c.closedAt);},0)/closed.length) : 0;
    return {u:u, cs:cs.length, sv:sv.length, closed:closed.length, med:med}; });

  return '<div class="stack">'+
   '<div class="grid '+(A?'g3':'g2')+'">'+
    '<div class="card"><div class="chd"><div class="ct">'+
     (A?'Aylık kâr — son 6 ay':'Aylık brüt hacim — son 6 ay')+'</div></div><div class="cbd">'+
     '<div style="display:flex;align-items:flex-end;gap:11px;height:150px">'+
     months.map(function(k,i){ var v=mVal(k);
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">'+
       '<span class="num fnt" style="font-size:10.5px">'+mk(v)+'</span>'+
       '<div style="width:100%;height:'+Math.max(4,Math.round(v/mxM*104))+'px;'+
       'border-radius:var(--r) var(--r) 0 0;background:'+(i===5?'var(--ac)':'var(--ac-soft)')+';'+
       'border:var(--bw) solid var(--ac)"></div>'+
       '<span class="fnt" style="font-size:10.5px">'+k.substring(5)+'</span></div>'; }).join('')+
     '</div></div></div>'+
    '<div class="card"><div class="chd"><div class="ct">Hizmet türü dağılımı</div></div>'+
     '<div class="cbd stack" style="gap:11px">'+
     tOrder.map(function(t){ return '<div><div class="row" style="font-size:12px;margin-bottom:4px">'+
      '<span class="mut" style="font-weight:600">'+TYPE[t].n+'</span>'+
      '<span class="num fnt spread">'+m0(byType[t])+'</span></div>'+
      '<div class="bar"><div style="width:'+Math.round(byType[t]/mxT*100)+'%;background:var(--ac)"></div></div>'+
      '</div>'; }).join('')+'</div></div>'+
    (A?'<div class="card"><div class="chd"><div class="ct">KDV özeti</div></div>'+
     '<div class="cbd stack" style="gap:11px;font-size:12.5px">'+
     sv('İndirilecek KDV','<b class="num">'+m0(vatIn)+'</b>')+
     sv('Hesaplanan KDV','<b class="num">'+m0(vatOut)+'</b>')+
     '<div class="row" style="padding-top:11px;border-top:var(--bw) solid var(--line)">'+
     '<b>Ödenecek KDV</b><b class="num spread">'+m0(vatOut-vatIn)+'</b></div>'+
     '<div class="note b">Mali müşavir mutabakatı için. Matrah, KDV ve genel toplam '+
     'ayrı üç sütun olarak raporlanır.</div></div></div>':'')+'</div>'+
   '<div class="grid g2">'+
    '<div class="card"><div class="chd"><div class="ct">Otel istatistikleri</div></div>'+
     '<div class="tw"><table><thead><tr><th>Otel</th><th>Adet</th><th class="r">Ort. gecelik</th>'+
     (A?'<th class="r">Kâr</th>':'')+'</tr></thead><tbody>'+
     hotels.map(function(h){ return '<tr><td data-l="Otel"><b>'+esc(h.n)+'</b>'+
      '<div class="fnt" style="font-size:11px">'+h.c+'</div></td>'+
      '<td data-l="Adet" class="num mut">'+h.k+'</td>'+
      '<td data-l="Ort." class="r num">'+m0(h.avg)+'</td>'+
      (A?'<td data-l="Kâr" class="r num"><b style="color:var(--ok)">+'+m0(h.mg)+'</b></td>':'')+
      '</tr>'; }).join('')+'</tbody></table></div></div>'+
    '<div class="card"><div class="chd"><div class="ct">Personel</div></div>'+
     '<div class="tw"><table><thead><tr><th>Kullanıcı</th><th>Dosya</th><th>Hizmet</th>'+
     '<th class="r">Ort. çözüm</th></tr></thead><tbody>'+
     staff.map(function(x){ return '<tr><td data-l="Kullanıcı"><div class="row">'+
      '<span class="av" style="background:'+x.u.c+'">'+x.u.k+'</span><b>'+x.u.n+'</b></div></td>'+
      '<td data-l="Dosya" class="num mut">'+x.cs+'</td>'+
      '<td data-l="Hizmet" class="num mut">'+x.sv+'</td>'+
      '<td data-l="Ort. çözüm" class="r num">'+x.med+' gün</td></tr>'; }).join('')+
     '</tbody></table></div></div></div></div>';
}

/* ---------- gerçek görsel sıkıştırma ---------- */
function compressImage(file, cb){
  var url=URL.createObjectURL(file), img=new Image();
  img.onload=function(){
    var max=1600, w=img.naturalWidth, h=img.naturalHeight;
    if(Math.max(w,h)>max){ var k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
    var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    var ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
    ctx.drawImage(img,0,0,w,h);
    cv.toBlob(function(b){ URL.revokeObjectURL(url); cb(b, w+'×'+h+' px'); }, 'image/jpeg', 0.72);
  };
  img.onerror=function(){ URL.revokeObjectURL(url); cb(null,null); };
  img.src=url;
}
function handleDocFile(file){
  if(!file) return;
  var ext=(file.name.split('.').pop()||'').toLowerCase();
  var kind = /^(jpg|jpeg|png|webp|gif|bmp|heic|heif)$/.test(ext) ? 'image'
           : /^(xlsx|xls|csv)$/.test(ext) ? 'excel' : 'pdf';
  var base=file.name.replace(/\.[^.]+$/,'');
  if(kind==='image'){
    compressImage(file, function(blob, dim){
      S.docFile={ origName:file.name, name:base, kind:'image', bytesOrig:file.size,
        bytes: blob? blob.size : file.size, url: URL.createObjectURL(blob||file),
        dim:dim, tag:'Dekont' };
      render();
    });
  } else {
    S.docFile={ origName:file.name, name:base, kind:kind, bytesOrig:file.size, bytes:file.size,
      url:URL.createObjectURL(file), tag: kind==='excel'?'Diğer':'Tedarikçi faturası' };
    render();
  }
}

function locParseInput(){
  var inp=document.getElementById('locin'), out=document.getElementById('locres');
  if(!inp) return;
  var v=inp.value.trim();
  if(!v){ if(out) out.innerHTML='Google · Apple · Yandex linkleri ve çıplak koordinat kabul edilir.'; return; }
  var r=parseLoc(v);
  if(!r){ if(out) out.innerHTML='<span style="color:var(--dg)">Bu linkten koordinat okunamadı. '+
    'Konumu WhatsApp\'ta açıp "bağlantıyı kopyala" ile alın.</span>'; return; }
  var map=document.getElementById('locmap');
  var fx=null, fy=null;
  if(map){
    var bLat=+map.getAttribute('data-lat'), bLng=+map.getAttribute('data-lng');
    fx=Math.max(0,Math.min(100,(0.5+(r.lng-bLng)/(2*LOC_SPAN))*100));
    fy=Math.max(0,Math.min(100,(0.5-(r.lat-bLat)/(2*LOC_SPAN))*100));
  }
  setLocDraft({lat:r.lat, lng:r.lng, fx:fx, fy:fy}, r.src+' konumu');
  if(out) out.innerHTML='<span style="color:var(--ok)">✓ '+esc(r.src)+' bağlantısı okundu — '+
    '<b class="num">'+r.lat+', '+r.lng+'</b>. Harita üzerinde işaretlendi.</span>';
}
function mgPreview(){
  var inp=document.getElementById('mgin'); if(!inp) return;
  var v=inp.value===''?null:+inp.value;
  var isLine=S.editScope==='svc';
  var c=caseById(S.caseId);
  var prev=document.getElementById('mgprev'), warn=document.getElementById('mgwarn');
  if(isLine){
    var s=SERVICES.filter(function(x){return x.id===S.editSvc;})[0];
    var net=r2(s.gross/(1+s.vat/100));
    var pct = v!=null ? v : (c.mg!=null ? c.mg : TYPE[s.type].mg);
    if(prev) prev.innerHTML = 'Matrah '+m(net)+' → marj <b style="color:var(--ok)">+'+
      m(r2(net*pct/100))+'</b> (%'+pct+')';
    if(warn) warn.style.display = (pct < TYPE[s.type].mg) ? '' : 'none';
  } else {
    var tot=0, base=0;
    svcOf(c.id).forEach(function(s){
      var net=r2(s.gross/(1+s.vat/100));
      var pct = (s.mg!=null) ? s.mg : (v!=null ? v : TYPE[s.type].mg);
      tot += r2(net*pct/100); base += net; });
    if(prev) prev.innerHTML = 'Dosya matrahı '+m(r2(base))+' → toplam marj '+
      '<b style="color:var(--ok)">+'+m(r2(tot))+'</b>';
  }
}
function refreshDrawerCount(sc){
  var n=filterRows(sc).length;
  var dc=document.getElementById('drawercount'); if(dc) dc.textContent=n+' kayıt eşleşiyor';
}
function refreshHidden(sc){
  var qk=document.querySelectorAll('.mdl [data-preset]');
  for(var i=0;i<qk.length;i++){
    if(qk[i].getAttribute('data-preset')===F[sc].preset) qk[i].setAttribute('aria-pressed','true');
    else qk[i].removeAttribute('aria-pressed'); }
}
var _drag=false;
document.addEventListener('pointerdown', function(e){
  var mp=e.target.closest && e.target.closest('#locmap'); if(!mp) return;
  _drag=true; mp.setPointerCapture && mp.setPointerCapture(e.pointerId);
  setLocDraft(locFromPoint(mp, e.clientX, e.clientY));
});
document.addEventListener('pointermove', function(e){
  if(!_drag) return;
  var mp=document.getElementById('locmap'); if(!mp) return;
  setLocDraft(locFromPoint(mp, e.clientX, e.clientY));
});
document.addEventListener('pointerup', function(){ _drag=false; });

document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && S.modal){ S.modal=null; S.drawer=null; render(); return; }
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''));
  if(((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k') || (e.key==='/' && !typing)){
    e.preventDefault(); S.modal='search'; render();
    setTimeout(function(){ var i=document.getElementById('gsin'); if(i){ i.focus(); i.select(); } },30);
  } });

function setRole(r){
  S.role=r; try{ localStorage.setItem('helpist.role',r); }catch(e){}
  if(r!=='admin' && ADMIN_SCREENS[S.screen]) S.screen='cases';
  S.modal=null; render();
  toast(r==='admin' ? 'Yönetici görünümü — marj, KDV ve fatura tutarları görünür'
                    : 'Operasyon görünümü — marj ve fatura alanları hiç gönderilmiyor'); }

function act(a){
  if(a==='approve'){ S.caseId=CASES[0].id; S.screen='detail'; S.modal=null; render();
    toast(CASES[0].no+' açıldı — Ford maili onaylandı'); return; }
  if(a==='allsvc'){ S.casesTab='services'; S.screen='cases'; S.modal=null; render(); return; }
  if(a==='addsvc'){ S.modal='addService'; render(); return; }
  if(a==='extend'){ S.modal='extend'; render(); return; }
  if(a==='payment'){ S.modal='payment'; render(); return; }
  if(a==='collect'){ S.modal='collection'; render(); return; }
  if(a==='torole'){ setRole('admin'); return; }
  if(a==='torole2'){ setRole(H()?'user':'admin'); return; }
  if(a==='createcase'){
    var c={ id:'cNEW', no:'HLP-2026-000452', ext:'F-88402', co:'FORD', cu:'Zeynep Aydın',
      phone:'+90 545 217 63 44', plate:'06BFN45', brand:'Ford', model:'Kuga', year:2023,
      city:'Eskişehir', district:'Tepebaşı', issue:'Akü arızası · araç çalışmıyor',
      prio:'normal', status:'acik', user:'AY', openedAt:dayStart(TODAY), closedAt:null,
      formNeeded:true, docMissing:false, formMissing:true };
    CASES.unshift(c); _byId={};
    F.cases.preset='gun'; F.cases.dateField='opened';
    S.modal=null; S.screen='cases'; render();
    toast('HLP-2026-000452 açıldı — filtre "Bugün"e alındı, yeni dosya listede'); return; }
  if(a==='createsvc'){ S.modal=null; render();
    toast(TYPE[S.svcType].n+' hizmeti eklendi — brüt ₺11.000,00'); return; }
  if(a==='createext'){ S.modal=null; render(); toast('Uzatma eklendi — ana satıra bağlandı'); return; }
  if(a==='createpay'){ S.modal=null; render(); toast('Ödeme kaydedildi — dekont yüklendi'); return; }
  if(a==='createcoll'){ S.modal=null; S.screen='receivables'; render();
    toast('Tahsilat kaydedildi'); return; }
  if(a==='adddoc'){ S.docFile=null; S.modal='addDoc'; render(); return; }
  if(a==='savedoc'){
    var f=S.docFile; if(!f) return;
    var nmEl=document.getElementById('docname'), tgEl=document.getElementById('doctag');
    var nm=(nmEl&&nmEl.value.trim())||f.name, tg=(tgEl&&tgEl.value)||'Diğer';
    DOCS.push({ id:'dN'+Date.now(), caseId:S.caseId, name:nm, tag:tg, kind:f.kind,
      bytesOrig:f.bytesOrig, bytes:f.bytes, by:ADMIN.k, at:TODAY, url:f.url });
    var saved=f.bytes<f.bytesOrig ? ' · %'+Math.round((1-f.bytes/f.bytesOrig)*100)+' küçültüldü' : '';
    S.docFile=null; S.modal=null; render();
    toast('Belge eklendi — '+nm+' · '+kb(f.bytes)+saved); return; }
  if(a==='editloc'){ S.locDraft=null; S.modal='location'; render(); return; }
  if(a==='saveloc'){
    var c3=caseById(S.caseId), d=S.locDraft;
    if(!d){ S.modal=null; render(); toast('Konum değişmedi'); return; }
    c3.lat=d.lat; c3.lng=d.lng;
    c3.locSource = /whatsapp|google|apple|yandex|koordinat|bağlantı/i.test(d.src||'') ? 'whatsapp' : 'manual';
    c3.locUpdatedAt=TODAY; c3.locUpdatedBy=ADMIN.k;
    S.locDraft=null; S.modal=null; render();
    toast('Konum güncellendi — '+d.lat+', '+d.lng+' · '+(d.src||'elle işaretlendi'));
    return; }
  if(a==='takeover'){ S.modal='takeover'; render(); return; }
  if(a==='dotakeover'){
    var c=caseById(S.caseId); var old=(USERS.filter(function(x){return x.k===c.user;})[0]||ADMIN).n;
    c.user=ADMIN.k; S.modal=null; render();
    toast('Dosya devralındı — sorumlu '+old+' → '+ADMIN.n+'. Aktiviteye yazıldı.'); return; }
  if(a==='savemargin'){
    var inp=document.getElementById('mgin');
    var v = (!inp || inp.value==='') ? null : +inp.value;
    var c2=caseById(S.caseId);
    if(S.editScope==='svc'){
      var sv=SERVICES.filter(function(x){return x.id===S.editSvc;})[0];
      var was=svcCalc(sv).pct; sv.mg=v;
      var now=svcCalc(sv).pct;
      S.modal=null; render();
      toast(v==null? 'Satır kurala döndürüldü — %'+now
        : 'Satır marjı %'+was+' → %'+now+' yapıldı, loglandı');
    } else {
      var was2=c2.mg; c2.mg=v; S.modal=null; render();
      toast(v==null? 'Dosya marjı kaldırıldı, tür kuralları geçerli'
        : 'Dosya marjı %'+v+' yapıldı — satıra özel oranı olanlar hariç tüm satırlara uygulandı');
    }
    return; }
  if(a==='runbill'){ toast('Faturalandı işaretlendi ve kilitlendi'); return; }
}

render();
if(!document.getElementById('fcount')) {} else refreshList();

</script>
